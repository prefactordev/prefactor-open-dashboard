# Release automation. release-please watches conventional commits on the
# default branch and maintains a running release PR (version bump + CHANGELOG).
# Merging that PR tags vX.Y.Z and publishes a GitHub release — which triggers
# docker-publish.yml to push the image to GHCR.
#
# Commit style that drives it: `fix:` → patch, `feat:` → minor,
# `feat!:`/`BREAKING CHANGE:` → major. Anything else ships with the next bump.

name: Release Please

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
