# Weekly dependency PRs, grouped so routine bumps arrive as one reviewable PR
# instead of ten. Security updates still arrive individually and immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # typescript-eslint's peer range doesn't admit TS >= 6 yet; lift this
      # once https://typescript-eslint.io ships support.
      - dependency-name: typescript
        versions: [">=6"]
      # React 19 + Recharts 3 is a deliberate migration (types, breaking chart
      # APIs), not an auto-bump. Minors and patches still flow.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: recharts
        update-types: [version-update:semver-major]
      # Vite 7 requires Node >= 20.19, but package.json engines promise 18.17+
      # (users on Node 18 build via `npm start`). Take these majors when the
      # Node 18 floor is dropped; they also need manualChunks moved to the
      # function form.
      - dependency-name: vite
        versions: [">=7"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
